name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Préparer la base temporaire des tests
        run: rm -f /tmp/kropki-ci.db /tmp/kropki-ci.db-shm /tmp/kropki-ci.db-wal

      - name: Tests
        env:
          DATABASE_URL: file:/tmp/kropki-ci.db
        run: bun test packages/web/src/web/lib packages/web/src/api/services

      - name: Lint
        run: bun run lint

      - name: Vérifier les types du web
        if: always()
        run: bun run --cwd packages/web typecheck

      - name: Vérifier les types du desktop
        if: always()
        run: bun run --cwd packages/desktop typecheck

      - name: Vérifier les types du mobile
        if: always()
        run: bun run --cwd packages/mobile typecheck

      - name: Compiler les clients
        if: always()
        run: bun run build
