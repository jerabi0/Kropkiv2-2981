name: CI

on:
  pull_request:
  push:
    branches:
      - feat/online-disconnect-forfeit

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Tests
        env:
          DATABASE_URL: file::memory:
        run: bun test packages/web/src/web/lib packages/web/src/api/services

      - name: Lint
        run: bun run lint

      - name: Typecheck
        if: always()
        run: bun run --cwd packages/web typecheck
